<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini POS Kantin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  #nota{display:none}
  @media print{
    body>*:not(#nota){display:none!important}
    #nota{display:block;width:58mm;font:12px monospace}
  }
</style>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <span class="navbar-brand fw-bold">Mini POS Kantin</span>
    <button id="reset" class="btn btn-outline-light btn-sm">Reset data</button>
  </div>
</nav>
<main class="container-fluid py-3">
  <div class="row g-3 mb-3">
    <div class="col-12 col-md-4"><div class="card text-bg-primary h-100"><div class="card-body">
      <div class="small">Omzet hari ini</div><div class="fs-3 fw-bold" id="mOmzet">Rp0</div></div></div></div>
    <div class="col-6 col-md-4"><div class="card text-bg-success h-100"><div class="card-body">
      <div class="small">Sisa total stok</div><div class="fs-3 fw-bold" id="mStok">0</div></div></div></div>
    <div class="col-6 col-md-4"><div class="card text-bg-dark h-100"><div class="card-body">
      <div class="small">Transaksi hari ini</div><div class="fs-3 fw-bold" id="mTrx">0</div></div></div></div>
  </div>
  <div class="row g-3">
    <section class="col-lg-8">
      <form id="fProduk" class="card card-body mb-3">
        <div class="row g-2 align-items-end">
          <div class="col-md-5"><label class="form-label" for="fNama">Nama produk</label>
            <input id="fNama" class="form-control" required></div>
          <div class="col-6 col-md-3"><label class="form-label" for="fHarga">Harga (Rp)</label>
            <input id="fHarga" type="number" min="1" class="form-control" required></div>
          <div class="col-6 col-md-4"><label class="form-label" for="fStok">Stok</label>
            <input id="fStok" type="number" min="0" step="1" class="form-control" required></div>
          <div class="col-md-9"><label class="form-label" for="fGambar">Foto produk (.jpg / .jpeg, boleh dikosongkan)</label>
            <input id="fGambar" type="file" accept=".jpg,.jpeg,image/jpeg" class="form-control"></div>
          <div class="col-md-3 d-grid"><button class="btn btn-dark">Tambah</button></div>
        </div>
      </form>
      <div id="produk" class="row row-cols-1 row-cols-sm-2 row-cols-xl-3 g-3"></div>
    </section>
    <aside class="col-lg-4">
      <div class="card">
        <div class="card-header fw-bold">Keranjang</div>
        <ul class="list-group list-group-flush" id="keranjang"></ul>
        <div class="card-body">
          <div class="d-flex justify-content-between fs-5 fw-bold mb-3"><span>Total</span><span id="total">Rp0</span></div>
          <div class="btn-group w-100 mb-3" role="group" aria-label="Metode pembayaran">
            <input type="radio" class="btn-check" name="metode" id="m1" value="Tunai" checked>
            <label class="btn btn-outline-primary" for="m1">Tunai</label>
            <input type="radio" class="btn-check" name="metode" id="m2" value="QRIS">
            <label class="btn btn-outline-primary" for="m2">QRIS</label>
            <input type="radio" class="btn-check" name="metode" id="m3" value="Transfer Bank">
            <label class="btn btn-outline-primary" for="m3">Transfer Bank</label>
          </div>
          <div id="boxTunai" class="mb-3">
            <label class="form-label" for="uang">Uang diterima (Rp)</label>
            <input id="uang" type="number" min="0" class="form-control">
            <div id="kembali" class="mt-1"></div>
          </div>
          <button id="bayar" class="btn btn-success w-100" disabled>Bayar &amp; cetak nota</button>
        </div>
      </div>
    </aside>
  </div>
</main>
<div id="nota"></div>
<script src="app.js"></script>
</body>
</html>
